name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '25.9.0'

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: latest

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'LogLens ${{ github.ref_name }}'
          releaseBody: |
            ## LogLens ${{ github.ref_name }}

            Spring Boot 개발자를 위한 로그 분석 데스크탑 앱입니다.

            ### 다운로드 | Download
            | OS | 파일 |
            |----|------|
            | macOS Apple Silicon | `LogLens_*_aarch64.dmg` |
            | macOS Intel | `LogLens_*_x64.dmg` |
            | Windows | `LogLens_*_x64-setup.exe` |
            | Windows MSI | `LogLens_*_x64_en-US.msi` |
            | Windows 포터블 | `LogLens_*_x64_portable.exe` |

            ### 요구사항 | Requirements
            - macOS 10.15 이상
            - Windows 10 이상

            ### macOS 실행 시
            처음 실행 시 "개발자를 확인할 수 없습니다" 경고가 뜰 수 있습니다.
            Finder에서 앱을 우클릭 → [열기] 를 선택하면 실행됩니다.

            ### macOS 실행 시 보안 경고

            Apple Developer 서명이 없어 경고가 표시될 수 있습니다.

            **방법 1 (터미널)**
            ```bash
            xattr -cr /Applications/LogLens.app
            ```

            ### Windows 실행 시
            SmartScreen 경고가 뜰 경우
            [추가 정보] → [실행] 을 클릭하면 됩니다.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}