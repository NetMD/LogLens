[package]
name = "loglens"
version = "1.0.0"
description = "Spring log analysis desktop app"
authors = ["LogLens"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "loglens_lib"
crate-type = ["lib", "staticlib", "cdylib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-http = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
thiserror = "2"
notify = "6.1"
once_cell = "1"
font-kit = "0.14"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
async-compression = { version = "0.4", features = ["tokio", "gzip"] }

[target.'cfg(windows)'.dependencies]
winapi-util = "0.1"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
